# fly.toml app configuration file generated for skill-badges on 2026-11-06T19:23:10Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'skill-badges'
primary_region = 'arn'
kill_timeout = '15s'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
  size = 'shared-cpu-1x'
