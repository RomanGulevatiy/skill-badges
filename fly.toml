# fly.toml app configuration file
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "skillbadges"
primary_region = "arn"
kill_timeout = 120

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
