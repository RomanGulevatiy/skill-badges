services:
  skill-badges:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill-badges
    environment:
      - LOGGER_LEVEL=info
      - HTTP_ADDR=:8080
      - HTTP_SHUTDOWN_TIMEOUT=15s
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
